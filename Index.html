<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Balenrista Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0d0c0c; color: #d6d3d1; }
    .btn-orange-muted { background-color: #c2410c; color: #ffffff; font-weight: 600; transition: all 0.2s; }
    .btn-orange-muted:hover { background-color: #ea580c; }
    .sidebar-active { background-color: #1a1817; color: #f97316; border-left: 0px; border-bottom: 3px solid #c2410c; }
    @media (min-width: 1024px) {
      .sidebar-active { border-bottom: 0px; border-left: 4px solid #c2410c; }
    }
    .highlight-item { color: #f97316; font-weight: 700; background-color: #291205; padding: 2px 8px; border: 1px solid #7c2d12; border-radius: 6px; display: inline-block; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #141312; }
    ::-webkit-scrollbar-thumb { background: #2e2b2a; border-radius: 3px; }
  </style>
</head>
<body class="flex flex-col lg:flex-row h-screen overflow-hidden select-none">

  <div id="loading-overlay" class="fixed inset-0 bg-[#0d0c0c] z-50 flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="relative w-16 h-16 mb-4">
      <div class="absolute inset-0 border-4 border-[#1f1d1c] rounded-full"></div>
      <div class="absolute inset-0 border-4 border-[#ea580c] rounded-full border-t-transparent animate-spin"></div>
    </div>
    <p class="text-[#d6d3d1] text-sm font-bold tracking-widest animate-pulse">กำลังดึงข้อมูล...</p>
    <p class="text-[#57534e] text-[10px] mt-2">โปรดรอสักครู่</p>
  </div>

  <div class="w-full lg:w-64 bg-[#141312] border-b lg:border-b-0 lg:border-r border-[#1f1d1c] flex flex-col shrink-0 z-20 shadow-xl">
    <div class="flex flex-col lg:h-full lg:justify-between">
      <div>
        <div class="p-3 lg:p-6 border-b border-[#1f1d1c] flex items-center justify-center lg:justify-start gap-3">
          <div class="w-6 h-6 lg:w-7 lg:h-7 rounded bg-[#c2410c] flex items-center justify-center text-white shrink-0">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 lg:w-4 lg:h-4">
              <path d="M9 5H21V7H9V5ZM9 11H21V13H9V11ZM9 17H21V19H9V17ZM3 5H5V7H3V5ZM3 11H5V13H3V11ZM3 17H5V19H3V17Z" fill="currentColor"/>
            </svg>
          </div>
          <span class="font-bold text-[11px] lg:text-xs tracking-wider text-[#a8a29e] text-center lg:text-left">Balenrista BILL<br class="hidden lg:block">MANAGEMENT</span>
        </div>
        
        <nav class="flex lg:flex-col p-1.5 lg:p-3 gap-1 lg:gap-0 lg:space-y-1 overflow-x-auto">
          <a href="#" onclick="switchTab('control')" id="menu-control" class="sidebar-active flex-1 lg:flex-none flex justify-center lg:justify-start items-center gap-2 px-2 py-2.5 lg:px-4 lg:py-3 rounded-lg text-[11px] lg:text-sm font-medium transition-all shrink-0">
            <i class="fa-solid fa-receipt text-center"></i> ควบคุมบิล PDF
          </a>
          <a href="#" onclick="switchTab('slips')" id="menu-slips" class="flex-1 lg:flex-none flex justify-center lg:justify-start items-center gap-2 px-2 py-2.5 lg:px-4 lg:py-3 rounded-lg text-[11px] lg:text-sm font-medium text-[#78716c] hover:text-[#d6d3d1] hover:bg-[#1a1817] transition-all shrink-0">
            <i class="fa-solid fa-calendar-days text-center"></i> ดูสลิป & รายการ
          </a>
        </nav>
      </div>
      <div class="hidden lg:block p-4 border-t border-[#1f1d1c] text-[10px] text-[#57534e] tracking-wider text-center font-mono">DASHBOARD V2.5</div>
    </div>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden bg-[#0d0c0c]">
    
    <div id="tab-control" class="flex-1 p-4 lg:p-8 overflow-y-auto lg:overflow-hidden flex flex-col">
      <div class="mb-4 lg:mb-5 flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-base lg:text-lg font-bold text-[#e7e5e4] tracking-tight">ควบคุมบิล PDF</h1>
          <p class="text-[10px] lg:text-xs text-[#6b6661] mt-0.5">บิลที่ยังไม่ได้พิมพ์ จะถูกดันขึ้นแสดงไว้บนสุดเสมอ</p>
        </div>
        <button onclick="refreshData(this)" class="text-[#57534e] hover:text-[#ea580c] transition-all p-2 rounded-lg bg-[#141312] border border-[#1f1d1c]"><i class="fa-solid fa-rotate text-xs"></i></button>
      </div>
      
      <div class="flex flex-col lg:grid lg:grid-cols-3 gap-4 lg:gap-6 flex-1 min-h-0 pb-6 lg:pb-0">
        <div class="lg:col-span-2 bg-[#141312] rounded-xl border border-[#1f1d1c] p-3 lg:p-4 flex flex-col h-[40vh] lg:h-full overflow-hidden shadow-xl shrink-0">
          <div class="overflow-y-auto flex-1 space-y-1 pr-1" id="invoice-list-control"></div>
        </div>
        <div id="panel-preview-control" class="bg-[#141312] rounded-xl border border-[#1f1d1c] p-4 lg:p-5 flex flex-col min-h-[350px] lg:h-full overflow-hidden shadow-xl shrink-0">
          <div class="flex-1 overflow-y-auto">
            <span class="text-[10px] font-bold text-[#57534e] uppercase border-b border-[#1f1d1c] pb-2 block mb-3">📋 แผงควบคุมออกบิล</span>
            <div id="preview-control-section" class="space-y-3">
              <p class="text-[#57534e] text-xs text-center py-16">โปรดคลิกเลือกรายการรหัสบิล</p>
            </div>
          </div>
          <div id="action-section" class="hidden pt-4 border-t border-[#1f1d1c] space-y-3 shrink-0">
            <button id="btn-print" onclick="triggerPrint()" class="w-full btn-orange-muted text-[11px] lg:text-xs py-3 px-4 rounded-lg shadow-md flex items-center justify-center gap-2 uppercase tracking-wider">
              <i class="fa-solid fa-print text-xs"></i> สั่งปริ้น PDF ใบสำคัญจ่าย
            </button>
            <div id="share-container" class="hidden pt-1 flex items-center gap-2 bg-[#0d0c0c] border border-[#1f1d1c] rounded-lg p-1">
              <input type="email" id="share-email" placeholder="ใส่อีเมลผู้รับบิล..." class="flex-1 bg-transparent px-2 py-1.5 text-[11px] lg:text-xs text-white placeholder-[#44403c] focus:outline-none">
              <button onclick="triggerShare(this)" class="bg-[#2e2b2a] hover:bg-[#44403c] text-[#d6d3d1] text-[10px] lg:text-xs px-3 py-1.5 rounded-md font-medium">ส่งเมล</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-slips" class="flex-1 p-4 lg:p-8 overflow-y-auto lg:overflow-hidden flex flex-col hidden">
      <div class="mb-4 lg:mb-5 flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-base lg:text-lg font-bold text-[#e7e5e4] tracking-tight">ดูสลิปตามวันที่ & รายการ</h1>
        </div>
        <button onclick="refreshData(this)" class="text-[#57534e] hover:text-[#ea580c] transition-all p-2 rounded-lg bg-[#141312] border border-[#1f1d1c]"><i class="fa-solid fa-rotate text-xs"></i></button>
      </div>

      <div class="mb-4 lg:mb-5 space-y-2 bg-[#141312]/60 p-2.5 lg:p-3 rounded-xl border border-[#1f1d1c] shrink-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="text-[9px] lg:text-[10px] text-[#57534e] font-bold uppercase w-10 shrink-0">ปี:</span>
          <button onclick="setYear('2026', this)" class="year-btn px-2.5 py-1 bg-[#c2410c] text-[10px] lg:text-[11px] rounded border border-[#ea580c] text-white font-medium">2026</button>
          <button onclick="setYear('2025', this)" class="year-btn px-2.5 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400">2025</button>
        </div>
        <div class="flex items-center gap-1 overflow-x-auto pb-1">
          <span class="text-[9px] lg:text-[10px] text-[#57534e] font-bold uppercase w-10 shrink-0">เดือน:</span>
          <button onclick="setMonth('All', this)" class="month-btn px-2.5 py-1 bg-[#c2410c] text-[10px] lg:text-[11px] rounded border border-[#ea580c] text-white font-medium shrink-0">ALL</button>
          <button onclick="setMonth('01', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ม.ค.</button>
          <button onclick="setMonth('02', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ก.พ.</button>
          <button onclick="setMonth('03', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">มี.ค.</button>
          <button onclick="setMonth('04', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">เม.ย.</button>
          <button onclick="setMonth('05', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">พ.ค.</button>
          <button onclick="setMonth('06', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">มิ.ย.</button>
          <button onclick="setMonth('07', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ก.ค.</button>
          <button onclick="setMonth('08', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ส.ค.</button>
          <button onclick="setMonth('09', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ก.ย.</button>
          <button onclick="setMonth('10', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ต.ค.</button>
          <button onclick="setMonth('11', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">พ.ย.</button>
          <button onclick="setMonth('12', this)" class="month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0">ธ.ค.</button>
        </div>
      </div>
      
      <div class="flex flex-col lg:grid lg:grid-cols-3 gap-4 lg:gap-6 flex-1 min-h-0 pb-6 lg:pb-0">
        <div class="lg:col-span-2 bg-[#141312] rounded-xl border border-[#1f1d1c] p-3 lg:p-4 flex flex-col h-[40vh] lg:h-full overflow-hidden shadow-xl shrink-0">
          <div class="overflow-y-auto flex-1 space-y-1 pr-1" id="invoice-list-slips"></div>
        </div>
        <div id="panel-preview-slips" class="bg-[#141312] rounded-xl border border-[#1f1d1c] p-4 lg:p-5 flex flex-col min-h-[450px] lg:h-full overflow-hidden shadow-xl shrink-0">
          <span class="text-[10px] font-bold text-[#57534e] uppercase border-b border-[#1f1d1c] pb-2 block mb-3">🔍 ภาพสลิปหลักฐาน</span>
          <div id="preview-slip-section" class="flex-1 overflow-y-auto space-y-4">
            <p class="text-[#57534e] text-xs text-center font-medium py-20">โปรดเลือกบรรทัดรายการบิล</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้ครับ
    // -------------------------------------------------------------
    const API_URL = "https://script.google.com/macros/s/AKfycbxEmDYeDua7NjtdGtR2Ck0V1riT8GYnIR6kasEekzS32zXO411vTkvvcUwN-Wa4ckzb/exec"; 

    let globalData = [];
    let selectedItem = null;
    let currentYear = '2026';
    let currentMonth = 'All';

    // ฟังก์ชัน Escape HTML เพื่อความปลอดภัย
    function escapeHTML(str) {
      if (!str) return '';
      return str.toString().replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    // สั่งให้ดึงข้อมูลทันทีที่เปิดเว็บ
    window.onload = function() { refreshData(); };

    async function refreshData(btnElement) {
      document.getElementById('loading-overlay').classList.remove('hidden');
      
      if (btnElement) {
        const icon = btnElement.querySelector('i');
        if(icon) icon.classList.add('animate-spin');
      }

      try {
        const response = await fetch(`${API_URL}?action=getData`);
        const data = await response.json();
        globalData = data;
        
        if(globalData.length > 0 && globalData[0].error) {
           alert("เกิดปัญหาการดึงข้อมูลจาก Google Sheets: " + globalData[0].message);
        } else {
           renderData();
        }
      } catch (error) {
        alert("เชื่อมต่อฐานข้อมูลล้มเหลว โปรดตรวจสอบอินเทอร์เน็ตหรือ URL API");
      } finally {
        document.getElementById('loading-overlay').classList.add('hidden');
        if (btnElement) {
          const icon = btnElement.querySelector('i');
          if(icon) icon.classList.remove('animate-spin');
        }
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-control').classList.toggle('hidden', tab !== 'control');
      document.getElementById('tab-slips').classList.toggle('hidden', tab !== 'slips');
      
      let baseClassControl = "flex-1 lg:flex-none flex justify-center lg:justify-start items-center gap-2 px-2 py-2.5 lg:px-4 lg:py-3 rounded-lg text-[11px] lg:text-sm font-medium transition-all shrink-0";
      let baseClassSlips = "flex-1 lg:flex-none flex justify-center lg:justify-start items-center gap-2 px-2 py-2.5 lg:px-4 lg:py-3 rounded-lg text-[11px] lg:text-sm font-medium transition-all shrink-0";
      
      document.getElementById('menu-control').className = tab === 'control' ? "sidebar-active " + baseClassControl : baseClassControl + " text-[#78716c] hover:text-[#d6d3d1] hover:bg-[#1a1817]";
      document.getElementById('menu-slips').className = tab === 'slips' ? "sidebar-active " + baseClassSlips : baseClassSlips + " text-[#78716c] hover:text-[#d6d3d1] hover:bg-[#1a1817]";
    }

    function setYear(year, btn) {
      currentYear = year;
      document.querySelectorAll('.year-btn').forEach(b => b.className = "year-btn px-2.5 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400");
      btn.className = "year-btn px-2.5 py-1 bg-[#c2410c] text-[10px] lg:text-[11px] rounded border border-[#ea580c] text-white font-medium";
      renderData();
    }

    function setMonth(month, btn) {
      currentMonth = month;
      document.querySelectorAll('.month-btn').forEach(b => b.className = "month-btn px-2 py-1 bg-[#1a1817] text-[10px] lg:text-[11px] rounded border border-zinc-800 text-zinc-400 shrink-0");
      btn.className = "month-btn px-2.5 py-1 bg-[#c2410c] text-[10px] lg:text-[11px] rounded border border-[#ea580c] text-white font-medium shrink-0";
      renderData();
    }

    function renderData() {
      const containerControl = document.getElementById('invoice-list-control');
      const containerSlips = document.getElementById('invoice-list-slips');
      containerControl.innerHTML = ''; containerSlips.innerHTML = '';

      if(globalData.length === 0) {
        containerControl.innerHTML = `<p class="text-[#57534e] text-xs p-4 text-center mt-6">ไม่มีข้อมูลเอกสารในระบบ</p>`;
        containerSlips.innerHTML = `<p class="text-[#57534e] text-xs p-4 text-center mt-6">ไม่มีข้อมูลเอกสารในระบบ</p>`;
        return;
      }

      let seenDocs = new Set();
      let unprintedGroup = [];
      let printedGroup = [];

      globalData.forEach(item => {
        if(!seenDocs.has(item.docNo)) {
          seenDocs.add(item.docNo);
          if(item.isPrinted) printedGroup.push(item);
          else unprintedGroup.push(item);
        }
      });

      let controlFinalList = unprintedGroup.concat(printedGroup);
      
      if(controlFinalList.length === 0) {
        containerControl.innerHTML = `<p class="text-[#57534e] text-xs p-4 text-center mt-6">ไม่มีข้อมูลบิลในระบบ</p>`;
      } else {
        controlFinalList.forEach(item => {
          let div = document.createElement('div');
          div.className = `control-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#1f1d1c] cursor-pointer hover:bg-[#1a1817] flex justify-between items-center bg-[#141312]/40`;
          div.id = `control-${item.docNo}`;
          div.onclick = () => selectInvoiceControl(item);
          let badge = item.isPrinted 
            ? `<span class="text-[9px] lg:text-[10px] bg-[#1c1917] text-[#a8a29e] border border-[#2e2b2a] px-1.5 py-0.5 rounded">พิมพ์แล้ว</span>`
            : `<span class="text-[9px] lg:text-[10px] bg-[#451a03] text-[#f97316] border border-[#7c2d12]/40 px-1.5 py-0.5 rounded">ยังไม่พิมพ์</span>`;
          div.innerHTML = `<div><p class="font-mono text-[#d6d3d1] text-[11px] lg:text-xs font-semibold">${escapeHTML(item.docNo)}</p></div>${badge}`;
          containerControl.appendChild(div);
        });
      }

      let filteredData = globalData.filter(item => {
        if(!item.date) return false;
        const parts = item.date.split('/');
        if(parts.length < 3) return true;
        const isYearMatch = (parts[2] === currentYear);
        const isMonthMatch = (currentMonth === 'All' || parseInt(parts[1], 10) === parseInt(currentMonth, 10));
        return isYearMatch && isMonthMatch;
      });

      if(filteredData.length === 0) {
        containerSlips.innerHTML = `<p class="text-[#57534e] text-[11px] lg:text-xs p-4 text-center mt-6">❌ ไม่พบข้อมูลบิลในกลุ่มเดือนนี้</p>`;
      } else {
        filteredData.forEach(item => {
          let div = document.createElement('div');
          div.className = `slip-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#1f1d1c] cursor-pointer hover:bg-[#1a1817] flex justify-between items-center bg-[#141312]/40`;
          div.id = `slip-item-${item.uniqueId}`;
          div.onclick = () => selectInvoiceSlip(item);
          div.innerHTML = `
            <div class="flex flex-col gap-1">
              <p class="font-mono text-[#d6d3d1] text-[11px] lg:text-xs font-bold">${escapeHTML(item.docNo)}</p>
              <p class="text-[9px] lg:text-[11px] text-[#78716c] flex items-center gap-1.5 flex-wrap"><span>${escapeHTML(item.supplier)}</span> | <span class="highlight-item">${escapeHTML(item.itemName)}</span></p>
            </div>
            <div class="text-right flex flex-col gap-0.5">
              <span class="text-[11px] lg:text-xs text-[#ea580c] font-bold">${Number(item.amount).toLocaleString()} ฿</span>
              <span class="text-[8px] lg:text-[10px] text-[#57534e] font-mono"><i class="fa-regular fa-calendar"></i> ${escapeHTML(item.date)}</span>
            </div>
          `;
          containerSlips.appendChild(div);
        });
      }
    }

    function selectInvoiceControl(item) {
      selectedItem = item;
      document.querySelectorAll('.control-item').forEach(n => n.className = `control-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#1f1d1c] cursor-pointer hover:bg-[#1a1817] flex justify-between items-center bg-[#141312]/40`);
      document.getElementById(`control-${item.docNo}`).className = `control-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#c2410c]/40 cursor-pointer flex justify-between items-center bg-[#1a1817]`;

      const preview = document.getElementById('preview-control-section');
      let linkHTML = item.pdfUrl 
        ? `<div class="mt-3 p-3 bg-[#0d0c0c] rounded-lg border border-[#1f1d1c] text-center"><a href="${item.pdfUrl}" target="_blank" class="text-[#f97316] hover:text-[#ea580c] text-[11px] lg:text-xs font-medium"><i class="fa-solid fa-file-pdf"></i> คลิกเปิดเอกสาร PDF</a></div>` 
        : '<div class="mt-3 p-3 bg-[#0d0c0c] rounded-lg border border-[#1f1d1c] text-center text-[10px] lg:text-xs text-[#57534e]">บิลนี้ยังไม่ได้รันคำสั่งออกไฟล์ PDF</div>';

      preview.innerHTML = `
        <div class="bg-[#1a1817] p-2.5 lg:p-3 rounded-lg border border-[#1f1d1c] mb-2"><label class="text-[9px] lg:text-[10px] text-[#57534e] uppercase">เลขที่เอกสาร</label><p class="font-mono text-xs lg:text-sm font-bold text-white mt-0.5">${escapeHTML(item.docNo)}</p></div>
        <div class="bg-[#1a1817] p-2.5 lg:p-3 rounded-lg border border-[#1f1d1c]"><label class="text-[9px] lg:text-[10px] text-[#57534e] uppercase">วันที่ของเอกสาร</label><p class="font-mono text-[11px] lg:text-xs text-white mt-0.5">${escapeHTML(item.date)}</p></div>
        ${linkHTML}
      `;
      document.getElementById('action-section').classList.remove('hidden');
      
      const btnPrint = document.getElementById('btn-print');
      btnPrint.disabled = false;
      btnPrint.innerHTML = item.pdfUrl ? `<i class="fa-solid fa-rotate-right text-xs"></i> ออกเอกสาร PDF ใหม่อีกครั้ง` : `<i class="fa-solid fa-print text-xs"></i> สั่งปริ้น PDF ใบสำคัญจ่าย`;
      
      item.pdfUrl ? document.getElementById('share-container').classList.remove('hidden') : document.getElementById('share-container').classList.add('hidden');

      if(window.innerWidth < 1024) {
        setTimeout(() => { document.getElementById('panel-preview-control').scrollIntoView({behavior: "smooth", block: "start"}); }, 100);
      }
    }

    function selectInvoiceSlip(item) {
      document.querySelectorAll('.slip-item').forEach(n => n.className = `slip-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#1f1d1c] cursor-pointer hover:bg-[#1a1817] flex justify-between items-center bg-[#141312]/40`);
      document.getElementById(`slip-item-${item.uniqueId}`).className = `slip-item p-2.5 lg:p-3 mb-1.5 rounded-lg border border-[#c2410c]/40 cursor-pointer flex justify-between items-center bg-[#1a1817]`;

      let imgHTML = item.slipUrl 
        ? `<div class="bg-[#0d0c0c] p-2 rounded-lg text-center border border-[#1f1d1c] mt-2"><img src="${item.slipUrl}" class="max-h-56 lg:max-h-60 mx-auto rounded border border-[#2e2b2a] cursor-zoom-in" onclick="window.open('${item.slipUrl}', '_blank')"></div>`
        : `<div class="bg-[#0d0c0c] py-10 rounded-lg text-center text-[#57534e] text-[10px] lg:text-xs border border-[#1f1d1c] mt-2">❌ ไม่มีภาพสลิปหลักฐานในคอลัมน์ J</div>`;

      document.getElementById('preview-slip-section').innerHTML = `
        <div class="bg-[#1a1817] p-3 rounded-lg border border-[#1f1d1c] space-y-1.5 text-[10px] lg:text-xs">
          <div class="flex justify-between border-b border-[#0d0c0c] pb-1"><span class="text-[#57534e]">เลขที่เอกสาร:</span> <span class="font-mono text-white">${escapeHTML(item.docNo)}</span></div>
          <div class="flex justify-between border-b border-[#0d0c0c] pb-1"><span class="text-[#57534e]">วันที่:</span> <span class="text-[#d6d3d1]">${escapeHTML(item.date)}</span></div>
          <div class="flex justify-between border-b border-[#0d0c0c] pb-1"><span class="text-[#57534e]">รายการ:</span> <span class="highlight-item text-[9px] lg:text-[10px]">${escapeHTML(item.itemName)}</span></div>
          <div class="flex justify-between border-b border-[#0d0c0c] pb-1"><span class="text-[#57534e]">ยอดเงินรวม:</span> <span class="text-[#ea580c] font-bold">${Number(item.amount).toLocaleString()} บาท</span></div>
          <div class="flex justify-between"><span class="text-[#57534e]">ชำระผ่าน:</span> <span class="text-white bg-[#c2410c]/30 px-1.5 py-0.5 rounded text-[9px]">${escapeHTML(item.payMethod || '-')}</span></div>
        </div>
        ${imgHTML}
      `;

      if(window.innerWidth < 1024) {
        setTimeout(() => { document.getElementById('panel-preview-slips').scrollIntoView({behavior: "smooth", block: "start"}); }, 100);
      }
    }

    async function triggerPrint() {
      if(!selectedItem) return;
      const btn = document.getElementById('btn-print');
      btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-xs"></i> กำลังแปลง PDF...`;
      btn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'print', docNo: selectedItem.docNo, rowNum: selectedItem.rowNum })
        });
        const res = await response.json();
        
        if(res.success) {
          alert(`สร้างไฟล์ PDF สำเร็จ!`);
          globalData.forEach(match => { if(match.docNo === selectedItem.docNo) { match.pdfUrl = res.pdfUrl; match.isPrinted = true; } });
          renderData(); selectInvoiceControl(selectedItem);
        } else {
          alert('เกิดข้อผิดพลาดในการทำ PDF: ' + res.message);
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-print text-xs"></i> สั่งปริ้น PDF ใบสำคัญจ่าย`;
        }
      } catch (error) {
        alert("การเชื่อมต่อล้มเหลว โปรดลองอีกครั้ง");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-print text-xs"></i> สั่งปริ้น PDF ใบสำคัญจ่าย`;
      }
    }

    async function triggerShare(btnElement) {
      const emailInput = document.getElementById('share-email');
      if(!emailInput.value.trim()) return alert('กรุณาระบุอีเมลผู้รับปลายทางก่อนจ้า');
      if(!selectedItem || !selectedItem.pdfUrl) return;

      const originalText = btnElement.innerHTML;
      btnElement.innerHTML = 'กำลังส่ง...';
      btnElement.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'share', email: emailInput.value.trim(), docNo: selectedItem.docNo, pdfUrl: selectedItem.pdfUrl })
        });
        const res = await response.json();
        
        if(res.success) { 
          alert(`แชร์ลิงก์สำเร็จ!`); 
          emailInput.value = ''; 
        } else {
          alert('จัดส่งอีเมลล้มเหลว: ' + res.message);
        }
      } catch (error) {
        alert("การเชื่อมต่อล้มเหลว โปรดลองอีกครั้ง");
      } finally {
        btnElement.innerHTML = originalText;
        btnElement.disabled = false;
      }
    }
  </script>
</body>
</html>
